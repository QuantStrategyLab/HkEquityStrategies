target-version = "py311"

[lint]
select = ["E4", "E7", "E9", "F", "B", "C901"]
ignore = ["E701", "E702", "E741", "F841", "B008", "F401", "E402"]

[lint.mccabe]
max-complexity = 15

[lint.per-file-ignores]
"tests/**/*.py" = ["E402", "B", "C901"]
"scripts/**/*.py" = ["E402", "B", "C901"]
"docs/**/*.py" = ["E402", "B", "C901"]
"src/hk_equity_strategies/runtime_live_enablement_evidence.py" = ["C901"]
"src/hk_equity_strategies/strategies/etf_rotation_core.py" = ["B", "C901"]
"src/hk_equity_strategies/strategies/hk_low_vol_dividend_quality_snapshot.py" = ["B"]
