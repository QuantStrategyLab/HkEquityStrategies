name: Drift Check

# Daily drift detection for HK equity strategies.

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      verification_only:
        description: "Run the existing AI review without publishing drift issues"
        required: false
        type: boolean
        default: false
      disable_legacy_pat_fallback:
        description: "Fail closed instead of falling back to legacy PATs when minting the read-only GitHub App token"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

jobs:
  preflight_backtests:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      lifecycle_preflight_artifact: lifecycle-preflight-${{ github.run_id }}-${{ github.run_attempt }}
      snapshot_repository_ref: ${{ steps.snapshot-input.outputs.snapshot_repository_ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Checkout QuantPlatformKit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: QuantStrategyLab/QuantPlatformKit
          ref: eae362bd3e3fad5be59a7615eeba10be839a9934
          path: external/QuantPlatformKit

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install pandas yfinance==1.2.2
          python -m pip install --no-deps -e .
          python -m pip install --no-deps -e external/QuantPlatformKit

      - name: Resolve snapshot repository ref
        id: snapshot-input
        run: |
          set -euo pipefail
          snapshot_repository_ref="$(
            git ls-remote \
              https://github.com/QuantStrategyLab/HkEquitySnapshotPipelines.git \
              refs/heads/main \
              | awk '{print $1}'
          )"
          if [[ ! "$snapshot_repository_ref" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Unable to resolve the public snapshot repository main SHA"
            exit 1
          fi
          echo "snapshot_repository_ref=$snapshot_repository_ref" >> "$GITHUB_OUTPUT"

      - name: Build lifecycle preflight bundle
        env:
          LIFECYCLE_PREFLIGHT_BUNDLE_ROOT: ${{ runner.temp }}/lifecycle-preflight-bundle
          INPUT_ARTIFACT_ROOT: ${{ runner.temp }}/hk-lifecycle-inputs
        run: |
          set -euo pipefail
          end_date="$(date -u -d 'tomorrow' '+%Y-%m-%d')"
          python scripts/build_lifecycle_preflight.py \
            --bundle-root "$LIFECYCLE_PREFLIGHT_BUNDLE_ROOT" \
            --input-artifact-root "$INPUT_ARTIFACT_ROOT" \
            --start 2020-08-27 \
            --end "$end_date"

      - name: Upload lifecycle preflight artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: lifecycle-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/lifecycle-preflight-bundle
          if-no-files-found: error
          retention-days: 14

      - name: Upload normalized market input artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: hk-lifecycle-inputs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hk-lifecycle-inputs
          if-no-files-found: error
          retention-days: 14

  drift:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: preflight_backtests
    permissions:
      contents: read
      issues: write
      id-token: write
    uses: QuantStrategyLab/QuantPlatformKit/.github/workflows/reusable-drift-check.yml@c9d5d26a7a1599801755e6d5193cd472e47dcfb8
    with:
      verification_only: ${{ github.event_name == 'workflow_dispatch' && inputs.verification_only }}
      disable_legacy_pat_fallback: ${{ github.event_name == 'workflow_dispatch' && inputs.disable_legacy_pat_fallback }}
      strategy_domain: hk_equity
      caller_event_name: ${{ github.event_name }}
      caller_pr_head_repository: ${{ github.event.pull_request.head.repo.full_name || '' }}
      snapshot_repository: QuantStrategyLab/HkEquitySnapshotPipelines
      snapshot_checkout_path: external/HkEquitySnapshotPipelines
      snapshot_repository_ref: ${{ needs.preflight_backtests.outputs.snapshot_repository_ref }}
      ai_service_url: ${{ vars.AI_SERVICE_URL }}
      ai_service_audience: ${{ vars.AI_SERVICE_AUDIENCE }}
      ai_service_reviewers_json: ${{ vars.AI_SERVICE_REVIEWERS_JSON }}
      quant_platform_kit_ref: eae362bd3e3fad5be59a7615eeba10be839a9934
      lifecycle_preflight_artifact: ${{ needs.preflight_backtests.outputs.lifecycle_preflight_artifact }}
    secrets:
      qsl_drift_app_id: ${{ secrets.QSL_DRIFT_APP_ID || secrets.QSL_GITHUB_APP_ID }}
      qsl_drift_app_private_key: ${{ secrets.QSL_DRIFT_APP_PRIVATE_KEY || secrets.QSL_GITHUB_APP_PRIVATE_KEY }}
      snapshot_repository_token: ${{ !(github.event_name == 'workflow_dispatch' && inputs.disable_legacy_pat_fallback) && (secrets.SNAPSHOT_REPOSITORY_TOKEN || secrets.QSL_REPO_SYNC_TOKEN || github.token) || '' }}
